<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="JVL Skillcheck — skill check minigame for FiveM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/><stop offset="0.6" stop-color="#0b1522"/><stop offset="1" stop-color="#101c2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.02" stop-color="#0b2545" stop-opacity="0"/><stop offset="0.25" stop-color="#0ea5e9"/>
      <stop offset="0.45" stop-color="#e9eef5"/><stop offset="0.62" stop-color="#38bdf8"/>
      <stop offset="0.95" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath>

