      <rect width="40" height="40" rx="8" fill="#13263d" stroke="#ffffff22"/><text x="20" y="27" text-anchor="middle" fill="#9fb0c3">W</text>
      <rect x="48" width="40" height="40" rx="8" fill="#13263d" stroke="#ffffff22"/><text x="68" y="27" text-anchor="middle" fill="#9fb0c3">A</text>
      <rect x="96" width="40" height="40" rx="8" fill="#13263d" stroke="#ffffff22"/><text x="116" y="27" text-anchor="middle" fill="#9fb0c3">S</text>
      <rect x="24" y="-48" width="40" height="40" rx="8" fill="#13263d" stroke="#ffffff22"/><text x="44" y="-21" text-anchor="middle" fill="#9fb0c3">D</text>
